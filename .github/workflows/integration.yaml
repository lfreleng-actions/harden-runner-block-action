---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Post-merge integration test.
#
# Triggers on every push to main and on manual workflow_dispatch.
# Tests that the action, when referenced by a full owner/repo@ref
# (and therefore with its pre: hook actually invoked by the GitHub
# Actions runner), publishes the env var early enough for a sibling
# step-security/harden-runner step to consume it in 'block' egress
# mode.
#
# This is the integration coverage that testing.yaml deliberately
# does NOT provide: testing.yaml invokes `node src/pre.mjs` directly
# because `uses: ./` (local action reference) skips pre hooks. The
# canonical pre-hook propagation path can therefore only get
# exercised against a non-local action reference. The workflow uses
# `@main` rather than a per-commit SHA pin because the GitHub
# Actions 'uses:' field does not support expressions — see the
# step-level comment below for the trade-off.
#
# The one job also proves the invalid_records default end to end. Its
# allow-list carries a hostname that can never resolve; handed to
# harden-runner as-is, that makes the agent revert and leave the job
# with no egress filtering at all. Filtered out first, block mode must
# hold: an allow-listed host connects and a host outside the list does
# not. Both checks share this job so that the workflow carries a single
# floating '@main' reference.

name: "Integration test (post-merge) 🔗"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  end-to-end-block-mode:
    name: "End-to-end: loader + harden-runner block mode"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the allow-list. We pin to '@main' rather than to a
      # specific commit SHA because the GitHub Actions 'uses:'
      # field does not support expressions (so `${{ github.sha }}`
      # would not interpolate). For a workflow that fires on
      # push to main, '@main' is the just-pushed commit anyway;
      # the small race window with a later push is acceptable for
      # an integration test. zizmor's unpinned-uses audit and
      # gha-workflow-linter's SHA-pin check are suppressed below
      # for the same reason: a SHA pin is not workable for an
      # in-repo, post-merge self-test of @main. The trailing
      # 'self-test' wording matters: gha-workflow-linter treats a
      # comment containing a 'test' word as a deliberate test
      # reference and downgrades the finding to a warning.
      #
      # The fixture holds api.github.com:443 and the RFC 6761 name
      # does-not-exist.invalid:443. Default-URL loading is covered by
      # testing.yaml; what only this job can show is the pre-hook
      # handover, which is the same whatever the source.
      - name: "Load allow-list (action under test, full ref)"
        id: load
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@main # zizmor: ignore[unpinned-uses] intentional self-test of @main
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions/harden-runner-block-action//tests/fixtures/allow_list_with_invalid.txt@main'

      # Sibling harden-runner step. Its pre: hook reads
      # ${{ env.CONNECTION_ALLOW_LIST }} and
      # ${{ env.HARDEN_RUNNER_EGRESS_POLICY }} (populated by the
      # loader's pre, which ran earlier in the pre phase) and
      # configures the network filter in block mode.
      - name: "Harden runner (block mode, consuming loader env vars)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ env.HARDEN_RUNNER_EGRESS_POLICY }}
          allowed-endpoints: ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Validate block-mode network access"
        shell: bash
        env:
          INVALID_RECORDS: ${{ steps.load.outputs.invalid_records }}
        run: |
          # Validate block-mode network access
          set -euo pipefail
          if [ -z "${CONNECTION_ALLOW_LIST:-}" ]; then
            echo "Error: CONNECTION_ALLOW_LIST not present in env ❌"
            exit 1
          fi
          if [ "${INVALID_RECORDS}" != 'does-not-exist.invalid:443' ]; then
            echo "Error: invalid_records='${INVALID_RECORDS}' ❌"
            exit 1
          fi
          case " ${CONNECTION_ALLOW_LIST} " in
            *' does-not-exist.invalid:443 '*)
              echo "Error: invalid entry reached harden-runner ❌"
              exit 1
              ;;
          esac
          if [ "${HARDEN_RUNNER_EGRESS_POLICY:-}" != 'block' ]; then
            echo "Error: egress policy" \
              "'${HARDEN_RUNNER_EGRESS_POLICY:-}' ❌"
            exit 1
          fi
          echo "Loader published: ${CONNECTION_ALLOW_LIST}"
          curl --fail --silent --show-error --max-time 10 \
            -o /dev/null https://api.github.com/zen
          echo "Allow-listed host reachable ✅"
          # Not in the list: harden-runner sinkholes the lookup and
          # refuses the connection. Had the agent failed open, this
          # would connect.
          if curl --silent --max-time 10 -o /dev/null \
            https://www.example.org/; then
            echo "Error: www.example.org reachable; block mode failed open ❌"
            exit 1
          fi
          echo "Host outside the allow-list blocked; block mode held ✅"
