---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow.
#
# The GitHub Actions runner does NOT execute an action's pre: hook
# when the action is referenced as a local action (`uses: ./`); only
# main runs. The runner emits a warning to that effect. All of this
# action's load + sanitise + exportVariable logic lives in pre.mjs,
# so a `uses: ./` self-test would silently skip the real code path.
#
# These tests therefore invoke `node src/pre.mjs` directly, with the
# inputs supplied via the documented INPUT_* env-var protocol and
# the runner outputs (GITHUB_ENV / GITHUB_OUTPUT / GITHUB_STEP_SUMMARY)
# redirected to temporary files. Asserts on exit code and on the
# captured env/output files give us the same coverage we would have
# wanted from a self-`uses: ./` integration test, without the local-
# action pre limitation.
#
# End-to-end integration with step-security/harden-runner — where
# the action runs by full owner/repo@ref reference, the pre: hook
# actually fires, and a sibling harden-runner step consumes the
# published env var in block mode — lives in
# .github/workflows/integration.yaml. That workflow triggers on
# push to main (i.e. after merge) so it can reference the
# just-merged action by its public ref.

name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Happy path: valid local allow-list file. Asserts the action
  ### exits 0, writes the env var, writes outputs, and that the
  ### published value is the sanitised whitespace-collapsed list.
  test-happy-path-local-file:
    name: "Happy path: local file"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Stage local allow-list file"
        id: stage
        shell: bash
        run: |
          # Stage local allow-list file
          set -euo pipefail
          al_file="${RUNNER_TEMP}/local-allow-list.txt"
          cat > "$al_file" <<'EOF'
          # Test allow-list (multi-line, comments allowed)
          github.com:443
          api.github.com:443
          *.githubusercontent.com:443  # inline comment
          objects.githubusercontent.com:443
          EOF
          echo "al_file=$al_file" >> "$GITHUB_OUTPUT"

      - name: "Run pre.mjs (action under test)"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ${{ steps.stage.outputs.al_file }}
          INPUT_URL: ""
          INPUT_ORG: ""
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Run pre.mjs (action under test)
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env"
          : > "$captured_out"
          : > "$captured_sum"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs

          echo "::group::Captured GITHUB_ENV"
          cat "$captured_env"
          echo "::endgroup::"
          echo "::group::Captured GITHUB_OUTPUT"
          cat "$captured_out"
          echo "::endgroup::"

          # Assertions.
          if ! grep -q '^CONNECTION_ALLOW_LIST=github\.com:443 ' \
                 "$captured_env"; then
            echo "Error: CONNECTION_ALLOW_LIST missing or wrong ❌"
            exit 1
          fi
          if ! grep -q 'objects\.githubusercontent\.com:443' \
                 "$captured_env"; then
            echo "Error: last entry missing from env ❌"
            exit 1
          fi
          if ! grep -q '^source=path$' "$captured_out"; then
            echo "Error: source output != path ❌"
            exit 1
          fi
          if ! grep -q '^resolved_url=$' "$captured_out"; then
            echo "Error: resolved_url not empty for path source ❌"
            exit 1
          fi
          # Inline comments must be stripped.
          if grep -q 'inline comment' "$captured_env"; then
            echo "Error: inline '#' comment leaked into env ❌"
            exit 1
          fi
          echo "Happy-path local-file assertions passed ✅"

  ### Happy path: URL fetch via the default URL constructor. Confirms
  ### the action can reach raw.githubusercontent.com and that the
  ### sanitiser accepts a real-world allow-list.
  test-happy-path-default-url:
    name: "Happy path: default URL"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs against the default URL"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ""
          INPUT_URL: ""
          INPUT_ORG: "lfreleng-actions"
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Run pre.mjs against the default URL
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs

          if ! grep -q '^source=default-url$' "$captured_out"; then
            echo "Error: source output != default-url ❌"
            exit 1
          fi
          # The expected resolved_url is long; split the literal
          # across two shell variables so the line stays <80 cols.
          want_url_a="^resolved_url=https://raw.githubusercontent.com"
          want_url_b="/lfreleng-actions/.github/HEAD/"
          want_url_c=".github/harden-runner/lfreleng-actions/allow_list.txt$"
          want_url="${want_url_a}${want_url_b}${want_url_c}"
          if ! grep -Eq "$want_url" "$captured_out"; then
            echo "Error: resolved_url wrong ❌"
            cat "$captured_out"
            exit 1
          fi
          # Env var should carry a non-trivial number of endpoints.
          # Use wc -w (word count): wc -l would undercount by 1 when
          # the captured value has no trailing newline.
          count=$(grep '^CONNECTION_ALLOW_LIST=' "$captured_env" \
            | sed 's/^CONNECTION_ALLOW_LIST=//' | wc -w | tr -d ' ')
          if [ "$count" -lt 10 ]; then
            echo "Error: expected >=10 endpoints, got $count ❌"
            exit 1
          fi
          echo "Happy-path default-URL assertions passed ($count endpoints) ✅"

  ### Config mode (Node→Python integration). Asserts that pre.mjs
  ### invokes the shared resolver, fetches the live allow-list via
  ### git, publishes the env var, and emits the resolved_* outputs
  ### (notably the peeled commit resolved_sha).
  test-config-mode:
    name: "Config mode: git fetch"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs in config mode"
        shell: bash
        env:
          # Pinned to an immutable commit SHA so the assertions below
          # do not depend on the mutable contents of
          # lfreleng-actions/.github@main.
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@9e51be0a6ca2c2ce11d418e87b4a425d86a329fa"
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
          GITHUB_REPOSITORY_OWNER: "lfreleng-actions"
        run: |
          # Run pre.mjs in config mode (exercises the Python resolver)
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/cfg_env"
          captured_out="${RUNNER_TEMP}/cfg_out"
          captured_sum="${RUNNER_TEMP}/cfg_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs

          if ! grep -q '^source=config$' "$captured_out"; then
            echo "Error: source output != config ❌"
            cat "$captured_out"
            exit 1
          fi
          if ! grep -q '^found=true$' "$captured_out"; then
            echo "Error: found output != true ❌"
            exit 1
          fi
          # resolved_sha must be a 40-char commit SHA (peeled, not a
          # tag object): proves the Node→Python wiring populated it.
          if ! grep -Eq '^resolved_sha=[0-9a-f]{40}$' "$captured_out"; then
            echo "Error: resolved_sha not a 40-char commit SHA ❌"
            cat "$captured_out"
            exit 1
          fi
          # Declared outputs must use the resolved_* names.
          for key in resolved_host_org resolved_repo resolved_ref; do
            if ! grep -q "^${key}=" "$captured_out"; then
              echo "Error: missing output ${key} ❌"
              exit 1
            fi
          done
          count=$(grep '^CONNECTION_ALLOW_LIST=' "$captured_env" \
            | sed 's/^CONNECTION_ALLOW_LIST=//' | wc -w | tr -d ' ')
          if [ "$count" -lt 10 ]; then
            echo "Error: expected >=10 endpoints, got $count ❌"
            exit 1
          fi
          echo "Config-mode assertions passed ($count endpoints) ✅"

  ### Unit tests for the supplemental helpers.
  ###
  ### These live here rather than in resolver-tests.yaml, which is
  ### path-filtered to the mirrored Python resolver and its suites. A
  ### step added there would not run for a pull request touching only
  ### src/supplemental.mjs or this file's tests -- that is, for exactly
  ### the changes these tests exist to catch. testing.yaml carries no
  ### path filter, and the helpers are action code rather than resolver
  ### code, so this is also where they belong.
  test-supplemental-units:
    name: "Supplemental: unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Named explicitly rather than pointing node at tests/, which
      # would try to execute the mirrored Python suite alongside it.
      - name: "Run supplemental allow-list unit tests"
        shell: bash
        run: |
          # Trust rule, coordinate round-trip and merge semantics
          node --test tests/test_supplemental.mjs

  ### Supplemental allow-list: a real, two-fetch merge.
  ###
  ### Both specs name the same shared list at two immutable commit
  ### SHAs, chosen because the later one is a strict superset of the
  ### earlier by exactly three endpoints -- among them
  ### registry.nordix.org:443, the endpoint that motivated the feature.
  ### Every assertion below is therefore exact rather than approximate,
  ### and the two SHAs also let the test prove the second resolver
  ### invocation did not overwrite the first one's outputs.
  ###
  ### Neither step sets GITHUB_REPOSITORY_OWNER: the runner owns that
  ### variable and a step's env: cannot repurpose it. Nothing here needs
  ### to. Both specs name their org explicitly, and the org-specific
  ### search candidate resolves to the same file on a fork through the
  ### sole-org fallback, so the counts hold either way.
  test-supplemental-merge:
    name: "Supplemental: merge two resolved lists"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs with a supplemental list"
        shell: bash
        env:
          # 2026-07-29: 168 endpoints.
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          # 2026-08-04: the same file, three endpoints later.
          # yamllint disable-line rule:line-length
          INPUT_SUPPLEMENTAL_CONFIG: "lfreleng-actions@7409b5aad828768b12d015848ee2a4d4dbf34610"
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Merge a supplemental allow-list into the baseline
          set -euo pipefail
          base_sha="886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          supp_sha="7409b5aad828768b12d015848ee2a4d4dbf34610"
          list_path=".github/harden-runner/lfreleng-actions/allow_list.txt"
          captured_env="${RUNNER_TEMP}/sup_env"
          captured_out="${RUNNER_TEMP}/sup_out"
          captured_sum="${RUNNER_TEMP}/sup_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs

          # The merged list is the union: 168 + 3.
          value=$(grep '^CONNECTION_ALLOW_LIST=' "$captured_env" \
            | sed 's/^CONNECTION_ALLOW_LIST=//')
          count=$(printf '%s' "$value" | wc -w | tr -d ' ')
          if [ "$count" -ne 171 ]; then
            echo "Error: expected 171 merged endpoints, got $count ❌"
            exit 1
          fi
          # The motivating endpoint: present only in the supplemental.
          case " $value " in
            *" registry.nordix.org:443 "*) ;;
            *)
              echo "Error: supplemental endpoint absent from merge ❌"
              exit 1
              ;;
          esac

          # The supplemental is reported distinctly, as a coordinate
          # that names the file rather than echoing the input spec.
          # Subpath before ref, matching the config grammar, so the
          # value pastes back into supplemental_config unchanged.
          expected="lfreleng-actions/.github//${list_path}@${supp_sha}"
          if ! grep -qxF "supplemental_source=${expected}" "$captured_out"
          then
            echo "Error: supplemental_source != ${expected} ❌"
            grep '^supplemental' "$captured_out" || true
            exit 1
          fi
          if ! grep -qxF "supplemental_sha=${supp_sha}" "$captured_out"; then
            echo "Error: supplemental_sha != ${supp_sha} ❌"
            exit 1
          fi
          if ! grep -qxF 'supplemental_count=171' "$captured_out"; then
            echo "Error: supplemental_count != 171 ❌"
            exit 1
          fi

          # The second resolver invocation writes no step outputs, so
          # the baseline's resolved_* values must survive untouched.
          if ! grep -qxF "resolved_sha=${base_sha}" "$captured_out"; then
            echo "Error: baseline resolved_sha overwritten ❌"
            grep '^resolved_' "$captured_out" || true
            exit 1
          fi
          if grep -qF "resolved_sha=${supp_sha}" "$captured_out"; then
            echo "Error: supplemental clobbered resolved_sha ❌"
            exit 1
          fi
          # allowed_endpoints and count are re-published so they
          # describe the merged set; GITHUB_OUTPUT is read in order, so
          # assert on the effective (last) value of each.
          if [ "$(grep '^count=' "$captured_out" | tail -1)" != 'count=171' ]
          then
            echo "Error: effective count output != 171 ❌"
            grep '^count=' "$captured_out" || true
            exit 1
          fi
          merged=$(grep '^allowed_endpoints=' "$captured_out" | tail -1 \
            | sed 's/^allowed_endpoints=//' | wc -w | tr -d ' ')
          if [ "$merged" -ne 171 ]; then
            echo "Error: effective allowed_endpoints has $merged ❌"
            exit 1
          fi

          # Exactly one baseline summary block, plus one supplemental
          # block: the second invocation must not duplicate the first.
          heading='^### 🛡️ Harden Runner Allow-list$'
          blocks=$(grep -c "$heading" "$captured_sum" || true)
          if [ "$blocks" -ne 1 ]; then
            echo "Error: expected 1 baseline summary block, got $blocks ❌"
            cat "$captured_sum"
            exit 1
          fi
          if ! grep -qF 'Allow-list (supplemental)' "$captured_sum"; then
            echo "Error: supplemental summary block missing ❌"
            cat "$captured_sum"
            exit 1
          fi
          if ! grep -qF 'Endpoints after merge: **171**' "$captured_sum"
          then
            echo "Error: supplemental summary total wrong ❌"
            cat "$captured_sum"
            exit 1
          fi
          if ! grep -qF 'Merged: **3** new, **168** already in the baseline' \
            "$captured_sum"
          then
            echo "Error: supplemental summary merge figures wrong ❌"
            cat "$captured_sum"
            exit 1
          fi
          echo "Supplemental merge assertions passed (171 endpoints) ✅"

      # The same two lists the other way round, which is the migration
      # path the de-duplication exists to support: an entry sits in both
      # while it moves from one to the other. It also disambiguates
      # supplemental_count, which in the step above happens to equal the
      # merged total because the supplemental was a superset. Here the
      # two differ, so the output can only mean "read from the
      # supplemental".
      - name: "Run pre.mjs with a fully-overlapping supplemental"
        shell: bash
        env:
          # 2026-08-04: 171 endpoints.
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@7409b5aad828768b12d015848ee2a4d4dbf34610"
          # 2026-07-29: 168 of those same endpoints, and nothing new.
          # yamllint disable-line rule:line-length
          INPUT_SUPPLEMENTAL_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # A supplemental that adds nothing must change nothing
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/ovl_env"
          captured_out="${RUNNER_TEMP}/ovl_out"
          captured_sum="${RUNNER_TEMP}/ovl_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs

          count=$(grep '^CONNECTION_ALLOW_LIST=' "$captured_env" \
            | sed 's/^CONNECTION_ALLOW_LIST=//' | wc -w | tr -d ' ')
          if [ "$count" -ne 171 ]; then
            echo "Error: expected the 171-endpoint baseline, got $count ❌"
            exit 1
          fi
          # 168 read from the supplemental, against a merged total of
          # 171: the two figures are deliberately different here.
          if ! grep -qxF 'supplemental_count=168' "$captured_out"; then
            echo "Error: supplemental_count != 168 ❌"
            grep '^supplemental' "$captured_out" || true
            exit 1
          fi
          # Nothing was added, so nothing needed re-publishing: 'count'
          # must appear exactly once, from the baseline resolver.
          emitted=$(grep -c '^count=' "$captured_out" || true)
          if [ "$emitted" -ne 1 ]; then
            echo "Error: count re-published $emitted times, expected 1 ❌"
            exit 1
          fi
          if ! grep -qxF 'count=171' "$captured_out"; then
            echo "Error: count output != 171 ❌"
            exit 1
          fi
          want='Merged: **0** new, **168** already in the baseline'
          if ! grep -qF "$want" "$captured_sum"; then
            echo "Error: supplemental summary overlap wording wrong ❌"
            cat "$captured_sum"
            exit 1
          fi
          echo "Full-overlap assertions passed (nothing added) ✅"

  ### Supplemental allow-list: the refusals and the tolerated miss.
  ###
  ### The trust rule is the whole reason an unpinned supplemental is
  ### safe to offer at all, so each way of getting past it has a test.
  ###
  ### None of these steps sets GITHUB_REPOSITORY_OWNER. The runner owns
  ### that variable and a step's env: cannot repurpose it, so a job that
  ### tried to pose as another org would silently test nothing: the
  ### spec would be same-org after all, and the merge would succeed.
  ### The cross-org cases below therefore name an org that is never the
  ### workflow org, which holds on this repository and on any fork.
  test-supplemental-trust:
    name: "Supplemental: trust rule and missing list"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Refused before any network access: the baseline is never
      # fetched either, so this costs one node startup.
      - name: "Unpinned cross-org supplemental (must fail)"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          INPUT_SUPPLEMENTAL_CONFIG: "onap//"
          INPUT_SUPPLEMENTAL_UNPINNED: "true"
        run: |
          # An unpinned supplemental from another org must be refused
          set -uo pipefail
          : > "${RUNNER_TEMP}/x_env" ; : > "${RUNNER_TEMP}/x_out"
          set +e
          GITHUB_ENV="${RUNNER_TEMP}/x_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/x_out" \
            node src/pre.mjs 2> "${RUNNER_TEMP}/x_err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: expected non-zero exit for cross-org unpinned ❌"
            exit 1
          fi
          if ! grep -q 'permitted only within' "${RUNNER_TEMP}/x_err"; then
            echo "Error: missing cross-org refusal message ❌"
            cat "${RUNNER_TEMP}/x_err"
            exit 1
          fi
          echo "Cross-org unpinned refusal passed (exit ${rc}) ✅"

      # Regression test. The resolver strips a trailing ' #...' comment
      # before splitting on '@'. A spec parser here that did not would
      # read 'example.com' as a ref, call this pinned, and wave an
      # unpinned cross-org list straight past the rule above. Note that
      # such a misparse fails with a different message, so the grep
      # below genuinely discriminates between the two behaviours.
      - name: "Comment-disguised unpinned supplemental (must fail)"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          INPUT_SUPPLEMENTAL_CONFIG: "onap//  # rotated by ops@example.com"
          INPUT_SUPPLEMENTAL_UNPINNED: "true"
        run: |
          # A trailing comment must not be mistaken for a pinned ref
          set -uo pipefail
          : > "${RUNNER_TEMP}/c_env" ; : > "${RUNNER_TEMP}/c_out"
          set +e
          GITHUB_ENV="${RUNNER_TEMP}/c_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/c_out" \
            node src/pre.mjs 2> "${RUNNER_TEMP}/c_err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: a comment bought trust it should not have ❌"
            exit 1
          fi
          if ! grep -q 'permitted only within' "${RUNNER_TEMP}/c_err"; then
            echo "Error: missing cross-org refusal message ❌"
            cat "${RUNNER_TEMP}/c_err"
            exit 1
          fi
          echo "Comment-disguise refusal passed (exit ${rc}) ✅"

      # Without the flag, a ref-less supplemental is refused before the
      # org is even considered, so this reports the missing flag rather
      # than the org mismatch whichever repository runs it.
      - name: "Unpinned supplemental without the flag (must fail)"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          INPUT_SUPPLEMENTAL_CONFIG: "lfreleng-actions//"
        run: |
          # A ref-less supplemental needs supplemental_unpinned
          set -uo pipefail
          : > "${RUNNER_TEMP}/f_env" ; : > "${RUNNER_TEMP}/f_out"
          set +e
          GITHUB_ENV="${RUNNER_TEMP}/f_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/f_out" \
            node src/pre.mjs 2> "${RUNNER_TEMP}/f_err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: expected non-zero exit without the flag ❌"
            exit 1
          fi
          if ! grep -q "no '@ref'" "${RUNNER_TEMP}/f_err"; then
            echo "Error: missing unpinned refusal message ❌"
            cat "${RUNNER_TEMP}/f_err"
            exit 1
          fi
          echo "Unpinned-without-flag refusal passed (exit ${rc}) ✅"

      - name: "Supplemental without config (must fail)"
        shell: bash
        env:
          INPUT_SUPPLEMENTAL_CONFIG: "lfreleng-actions@v0.11.1"
        run: |
          # supplemental_config has no meaning without a baseline
          set -uo pipefail
          : > "${RUNNER_TEMP}/n_env" ; : > "${RUNNER_TEMP}/n_out"
          set +e
          GITHUB_ENV="${RUNNER_TEMP}/n_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/n_out" \
            node src/pre.mjs 2> "${RUNNER_TEMP}/n_err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: expected non-zero exit without config ❌"
            exit 1
          fi
          if ! grep -q "requires 'config'" "${RUNNER_TEMP}/n_err"; then
            echo "Error: missing 'requires config' message ❌"
            cat "${RUNNER_TEMP}/n_err"
            exit 1
          fi
          echo "Supplemental-requires-config assertion passed ✅"

      # Neither lenient reading of a boolean is safe for a flag that
      # governs which remote content is trusted, so a value that is
      # neither 'true' nor 'false' is refused outright.
      - name: "Non-boolean supplemental_unpinned (must fail)"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          INPUT_SUPPLEMENTAL_CONFIG: "lfreleng-actions//"
          INPUT_SUPPLEMENTAL_UNPINNED: "yes"
        run: |
          # A near-miss boolean must not be read as permission
          set -uo pipefail
          : > "${RUNNER_TEMP}/b_env" ; : > "${RUNNER_TEMP}/b_out"
          set +e
          GITHUB_ENV="${RUNNER_TEMP}/b_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/b_out" \
            node src/pre.mjs 2> "${RUNNER_TEMP}/b_err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: expected non-zero exit for 'yes' ❌"
            exit 1
          fi
          if ! grep -q "must be 'true' or 'false'" "${RUNNER_TEMP}/b_err"
          then
            echo "Error: missing boolean validation message ❌"
            cat "${RUNNER_TEMP}/b_err"
            exit 1
          fi
          echo "Boolean validation assertion passed (exit ${rc}) ✅"

      # The common case for a project that has not created its list
      # yet: log the miss and carry on with the baseline alone.
      - name: "Absent supplemental is tolerated by default"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          # yamllint disable-line rule:line-length
          INPUT_SUPPLEMENTAL_CONFIG: "lfreleng-actions//absent_list_for_tests.txt@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # A missing supplemental leaves the baseline usable
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/m_env"
          captured_out="${RUNNER_TEMP}/m_out"
          : > "$captured_env" ; : > "$captured_out"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
            node src/pre.mjs

          count=$(grep '^CONNECTION_ALLOW_LIST=' "$captured_env" \
            | sed 's/^CONNECTION_ALLOW_LIST=//' | wc -w | tr -d ' ')
          if [ "$count" -ne 168 ]; then
            echo "Error: expected the 168-endpoint baseline, got $count ❌"
            exit 1
          fi
          if ! grep -qxF 'supplemental_count=0' "$captured_out"; then
            echo "Error: supplemental_count != 0 for an absent list ❌"
            exit 1
          fi
          if ! grep -qxF 'supplemental_source=' "$captured_out"; then
            echo "Error: supplemental_source not empty for an absent list ❌"
            exit 1
          fi
          echo "Absent-supplemental tolerance assertion passed ✅"

      - name: "Absent supplemental is fatal when required"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          INPUT_CONFIG: "lfreleng-actions@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          # yamllint disable-line rule:line-length
          INPUT_SUPPLEMENTAL_CONFIG: "lfreleng-actions//absent_list_for_tests.txt@886b0172ba2292fb3f3c76a3219ce85ff62cba39"
          INPUT_SUPPLEMENTAL_REQUIRED: "true"
        run: |
          # supplemental_required turns the same miss into a failure
          set -uo pipefail
          err="${RUNNER_TEMP}/r_err"
          : > "${RUNNER_TEMP}/r_env" ; : > "${RUNNER_TEMP}/r_out"
          set +e
          GITHUB_ENV="${RUNNER_TEMP}/r_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/r_out" \
            node src/pre.mjs 2> "$err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: expected non-zero exit when required ❌"
            exit 1
          fi
          if ! grep -q 'No allow-list found via supplemental_config' "$err"
          then
            echo "Error: missing required-supplemental message ❌"
            cat "$err"
            exit 1
          fi
          echo "Required-supplemental assertion passed (exit ${rc}) ✅"

  ### Config mutual-exclusion. Asserts that combining 'config' with a
  ### legacy source input (org) fails fast with a clear error, so the
  ### precedence rule cannot silently regress.
  test-config-exclusivity:
    name: "Config mode: mutual exclusion"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs with config + org (must fail)"
        shell: bash
        env:
          INPUT_CONFIG: "lfreleng-actions@main"
          INPUT_ORG: "lfreleng-actions"
          GITHUB_REPOSITORY_OWNER: "lfreleng-actions"
        run: |
          # config combined with a legacy source input must error
          set -uo pipefail
          captured_env="${RUNNER_TEMP}/exc_env"
          captured_out="${RUNNER_TEMP}/exc_out"
          : > "$captured_env" ; : > "$captured_out"
          set +e
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
            node src/pre.mjs 2> "${RUNNER_TEMP}/exc_err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: expected non-zero exit for config+org ❌"
            exit 1
          fi
          if ! grep -q 'mutually exclusive' "${RUNNER_TEMP}/exc_err"; then
            echo "Error: missing mutual-exclusion error message ❌"
            cat "${RUNNER_TEMP}/exc_err"
            exit 1
          fi
          echo "Config mutual-exclusion assertion passed (exit ${rc}) ✅"

  ### Custom env var name. Asserts that pre.mjs publishes to the
  ### requested env var and NOT to the default name.
  test-custom-env-var:
    name: "Custom env_var_name"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs with custom env_var_name"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ""
          INPUT_URL: ""
          INPUT_ORG: "lfreleng-actions"
          INPUT_ENV_VAR_NAME: "MY_ALLOW_LIST"
        run: |
          # Run pre.mjs with custom env_var_name
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs

          if ! grep -q '^MY_ALLOW_LIST=' "$captured_env"; then
            echo "Error: MY_ALLOW_LIST not published ❌"
            exit 1
          fi
          if grep -q '^CONNECTION_ALLOW_LIST=' "$captured_env"; then
            echo "Error: default CONNECTION_ALLOW_LIST unexpectedly published ❌"
            exit 1
          fi
          echo "Custom env_var_name assertions passed ✅"

  ### Failure: shell metacharacter token. Asserts the action exits
  ### non-zero and does NOT publish a partial allow-list.
  test-rejects-bad-input:
    name: "Rejects shell metacharacters"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Stage malicious allow-list file"
        id: stage
        shell: bash
        run: |
          # Stage malicious allow-list file
          set -euo pipefail
          al_file="${RUNNER_TEMP}/bad-allow-list.txt"
          # shellcheck disable=SC2016
          printf '%s\n' 'github.com:443 evil.com:443;`whoami`' > "$al_file"
          echo "al_file=$al_file" >> "$GITHUB_OUTPUT"

      - name: "Run pre.mjs against malicious file"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ${{ steps.stage.outputs.al_file }}
          INPUT_URL: ""
          INPUT_ORG: ""
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Run pre.mjs against malicious file
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          set +e
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: pre.mjs accepted malicious token (exit 0) ❌"
            cat "$captured_env"
            exit 1
          fi
          # Must NOT publish the env var when the sanitiser rejects.
          if grep -q '^CONNECTION_ALLOW_LIST=' "$captured_env"; then
            echo "Error: env var published despite failure ❌"
            exit 1
          fi
          echo "Sanitiser correctly rejected metacharacters (exit $rc) ✅"

  ### Failure: port out of range. Asserts the action rejects tokens
  ### whose port survives the regex but is not a real TCP/UDP port.
  test-rejects-bad-port:
    name: "Rejects port out of range"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Stage allow-list with bad port"
        id: stage
        shell: bash
        run: |
          # Stage allow-list with bad port
          set -euo pipefail
          al_file="${RUNNER_TEMP}/badport-allow-list.txt"
          echo 'evil.com:99999' > "$al_file"
          echo "al_file=$al_file" >> "$GITHUB_OUTPUT"

      - name: "Run pre.mjs against bad-port file"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ${{ steps.stage.outputs.al_file }}
          INPUT_URL: ""
          INPUT_ORG: ""
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Run pre.mjs against bad-port file
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          set +e
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: pre.mjs accepted out-of-range port (exit 0) ❌"
            exit 1
          fi
          echo "Sanitiser correctly rejected port 99999 (exit $rc) ✅"

  ### Failure: missing file. Asserts the action exits non-zero when
  ### given a path that does not exist.
  test-rejects-missing-file:
    name: "Rejects missing file"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs against missing file"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: "/tmp/does-not-exist-9f3a2b.txt"
          INPUT_URL: ""
          INPUT_ORG: ""
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Run pre.mjs against missing file
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          set +e
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: pre.mjs accepted missing file (exit 0) ❌"
            exit 1
          fi
          echo "Sanitiser correctly rejected missing file (exit $rc) ✅"

  ### Failure: invalid env_var_name (lowercase). Asserts the regex
  ### gate fires before any file/network work.
  test-rejects-invalid-env-var-name:
    name: "Rejects invalid env_var_name"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs with lowercase env_var_name"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ""
          INPUT_URL: ""
          INPUT_ORG: "lfreleng-actions"
          INPUT_ENV_VAR_NAME: "lowercase_var"
        run: |
          # Run pre.mjs with lowercase env_var_name
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          set +e
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: pre.mjs accepted invalid env_var_name (exit 0) ❌"
            exit 1
          fi
          echo "Invalid env_var_name correctly rejected (exit $rc) ✅"

  ### Failure: newline in path input. Asserts the injection guard
  ### fires.
  test-rejects-newline-in-path:
    name: "Rejects newline in path input"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs with newline in path"
        shell: bash
        # Use a multi-line literal so the path input actually
        # contains a newline character.
        env:
          INPUT_ALLOW_LIST_PATH: |
            /tmp/innocent
            INJECTED=evil
          INPUT_URL: ""
          INPUT_ORG: ""
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Run pre.mjs with newline in path
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          set +e
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Error: pre.mjs accepted newline in path (exit 0) ❌"
            exit 1
          fi
          if grep -q '^INJECTED=' "$captured_env"; then
            echo "Error: env injection succeeded ❌"
            exit 1
          fi
          echo "Newline-in-path correctly rejected (exit $rc) ✅"

  ### Redaction: URL credentials, query string, and fragment must not
  ### leak into the captured $GITHUB_OUTPUT or $GITHUB_STEP_SUMMARY
  ### when the user supplies a URL containing any of those. The
  ### actual fetch will probably 404 (we point at the canonical
  ### lfreleng-actions allow-list with fake credentials), but the
  ### test is only interested in what gets recorded BEFORE / DURING
  ### the fetch attempt.
  test-redacts-url-credentials:
    name: "Redacts URL credentials / query / fragment"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pre.mjs against a credential-bearing URL"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ""
          # yamllint disable-line rule:line-length
          INPUT_URL: "https://leak-user:leak-pass@raw.githubusercontent.com/lfreleng-actions/.github/HEAD/.github/harden-runner/lfreleng-actions/allow_list.txt?token=topsecret#frag"
          INPUT_ORG: ""
          INPUT_ENV_VAR_NAME: "CONNECTION_ALLOW_LIST"
        run: |
          # Run pre.mjs against a credential-bearing URL
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/captured_env"
          captured_out="${RUNNER_TEMP}/captured_out"
          captured_sum="${RUNNER_TEMP}/captured_sum"
          captured_stdout="${RUNNER_TEMP}/captured_stdout"
          captured_stderr="${RUNNER_TEMP}/captured_stderr"
          : > "$captured_env" ; : > "$captured_out" ; : > "$captured_sum"
          : > "$captured_stdout" ; : > "$captured_stderr"
          # The fetch will likely fail (HTTP 401 / 404), which is
          # fine: the test inspects what got written to the
          # GITHUB_* files BEFORE the failure terminates the
          # script. We allow either exit code.
          set +e
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="$captured_out" \
          GITHUB_STEP_SUMMARY="$captured_sum" \
            node src/pre.mjs > "$captured_stdout" 2> "$captured_stderr"
          rc=$?
          set -e
          echo "pre.mjs exit code: $rc"
          echo "::group::stdout (workflow commands)"
          cat "$captured_stdout"
          echo "::endgroup::"
          echo "::group::captured GITHUB_OUTPUT"
          cat "$captured_out"
          echo "::endgroup::"
          echo "::group::captured GITHUB_STEP_SUMMARY"
          cat "$captured_sum"
          echo "::endgroup::"

          # The captured GITHUB_OUTPUT and GITHUB_STEP_SUMMARY must
          # not contain any of the secret components. The error
          # annotation channel (stdout '::error::') is also part of
          # what the runner shows users, so we check it too. (We
          # do not check captured_stderr: stderr is not parsed by
          # the runner as workflow commands and is generally only
          # visible in raw logs to a workflow author.)
          leaks=0
          for needle in 'leak-user' 'leak-pass' 'token=topsecret' '#frag'; do
            for file in "$captured_out" "$captured_sum" "$captured_stdout"; do
              if grep -F -q "$needle" "$file"; then
                echo "❌ LEAK: '$needle' found in $(basename "$file")"
                leaks=$((leaks + 1))
              fi
            done
          done
          if [ "$leaks" -ne 0 ]; then
            echo "$leaks leak(s) detected ❌"
            exit 1
          fi
          # Positive assertion: the redacted form (scheme + host +
          # path) MUST appear in the captured stdout (which includes
          # the 'Source: ...' info line and the '::error::' annotation
          # that surfaces the fetch failure) so users can still see
          # which endpoint the action tried to reach. The action
          # exits non-zero before writing step outputs when the
          # fetch fails, so we cannot assert on captured_out here.
          expected_url="https://raw.githubusercontent.com/lfreleng-actions/.github/HEAD/.github/harden-runner/lfreleng-actions/allow_list.txt"
          if ! grep -F -q "$expected_url" "$captured_stdout"; then
            echo "Error: expected redacted URL not found in stdout ❌"
            exit 1
          fi
          echo "URL redaction validated ✅"

  ### Format equivalence: proves the ingress file layout does not
  ### change what the action publishes. The same endpoints are staged
  ### twice -- once as the legacy single, space-separated line, once as
  ### the new one-per-line file with header, full-line and inline '#'
  ### comments -- and the two published env-var values must be
  ### byte-identical. This is the production safety net for
  ### lfreleng-actions/.github#99: reformatting allow_list.txt must not
  ### perturb the allowed-endpoints list harden-runner enforces.
  test-format-equivalence:
    name: "Format equivalence: single-line vs multi-line"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Stage single-line and multi-line allow-list fixtures"
        id: stage
        shell: bash
        run: |
          # Stage both fixtures with the SAME endpoints in the SAME
          # order (the sanitiser preserves order, so the published
          # strings can only match if the layouts are truly equivalent).
          set -euo pipefail
          single="${RUNNER_TEMP}/single-line.txt"
          multi="${RUNNER_TEMP}/multi-line.txt"

          # Legacy format: one long, space-separated line. Build it
          # from short args so no source line exceeds the length limit;
          # the '%s ' template yields a single space-separated line.
          printf '%s ' \
            'github.com:443' \
            'api.github.com:443' \
            '*.githubusercontent.com:443' \
            'azure.archive.ubuntu.com:80' \
            'gerrit.o-ran-sc.org:29418' \
            'astral.sh' > "$single"
          printf '\n' >> "$single"

          # New format: one host[:port] per line, with a header block,
          # a full-line rationale comment and inline '#' comments.
          cat > "$multi" <<'EOF'
          # SPDX-License-Identifier: Apache-2.0
          # egress allow-list (one host[:port] per line)

          github.com:443
          # GitHub REST API
          api.github.com:443
          *.githubusercontent.com:443  # subdomain wildcard
          azure.archive.ubuntu.com:80
          gerrit.o-ran-sc.org:29418	# gerrit SSH (tab before comment)
          astral.sh
          EOF

          echo "single=$single" >> "$GITHUB_OUTPUT"
          echo "multi=$multi" >> "$GITHUB_OUTPUT"

      - name: "Run pre.mjs on both fixtures and diff the output"
        shell: bash
        env:
          SINGLE_FILE: ${{ steps.stage.outputs.single }}
          MULTI_FILE: ${{ steps.stage.outputs.multi }}
        run: |
          # Run pre.mjs on both fixtures and diff the output
          set -euo pipefail

          run_and_capture() {
            # $1 = allow-list path; echoes the published env-var value.
            local path="$1"
            local env_file
            env_file="$(mktemp "${RUNNER_TEMP}/env.XXXXXX")"
            INPUT_ALLOW_LIST_PATH="$path" \
            INPUT_URL="" \
            INPUT_ORG="" \
            INPUT_ENV_VAR_NAME="CONNECTION_ALLOW_LIST" \
            GITHUB_ENV="$env_file" \
            GITHUB_OUTPUT="$(mktemp "${RUNNER_TEMP}/out.XXXXXX")" \
            GITHUB_STEP_SUMMARY="$(mktemp "${RUNNER_TEMP}/sum.XXXXXX")" \
              node src/pre.mjs >/dev/null
            sed -n 's/^CONNECTION_ALLOW_LIST=//p' "$env_file"
          }

          single_value="$(run_and_capture "$SINGLE_FILE")"
          multi_value="$(run_and_capture "$MULTI_FILE")"

          echo "::group::Published values"
          echo "single-line: $single_value"
          echo "multi-line : $multi_value"
          echo "::endgroup::"

          if [ -z "$single_value" ]; then
            echo "Error: single-line fixture published no value ❌"
            exit 1
          fi
          if [ "$single_value" != "$multi_value" ]; then
            echo "Error: output differs between file formats ❌"
            diff <(printf '%s\n' "$single_value") \
                 <(printf '%s\n' "$multi_value") || true
            exit 1
          fi
          # Comments must never leak into the published list.
          for leaked in 'subdomain' 'wildcard' 'gerrit SSH' 'REST' '#'; do
            if printf '%s' "$multi_value" | grep -F -q "$leaked"; then
              echo "Error: comment text '$leaked' leaked into output ❌"
              exit 1
            fi
          done
          count=$(printf '%s' "$single_value" | wc -w | tr -d ' ')
          echo "Both formats published an identical $count-endpoint list ✅"

  ### GH_TELEMETRY policy. Asserts that the default publishes
  ### GH_TELEMETRY=false, that a caller's own value survives (including
  ### an explicitly empty one, which the CLI counts as falsey), and that
  ### disable_gh_telemetry=false leaves the environment untouched.
  ###
  ### Coverage note: the default-publishing case runs through config
  ### mode as well, because that flow returns early and once skipped the
  ### policy entirely. The caller-precedence and opt-out cases run
  ### through the local-file flow alone -- the policy runs ahead of the
  ### source branch, so those decisions cannot differ between flows.
  test-gh-telemetry-policy:
    name: "GH_TELEMETRY policy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Stage local allow-list file"
        id: stage
        shell: bash
        run: |
          # Stage local allow-list file
          set -euo pipefail
          al_file="${RUNNER_TEMP}/gh-telemetry-allow-list.txt"
          printf '%s\n' 'github.com:443' > "$al_file"
          echo "al_file=$al_file" >> "$GITHUB_OUTPUT"

      - name: "Default publishes GH_TELEMETRY=false"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ${{ steps.stage.outputs.al_file }}
        run: |
          # Default publishes GH_TELEMETRY=false
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/env_default"
          : > "$captured_env"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/out_default" \
          GITHUB_STEP_SUMMARY="${RUNNER_TEMP}/sum_default" \
            node src/pre.mjs
          if ! grep -q '^GH_TELEMETRY=false$' "$captured_env"; then
            echo "Error: GH_TELEMETRY=false not published by default ❌"
            cat "$captured_env"
            exit 1
          fi
          echo "Default case passed ✅"

      - name: "Config mode publishes it too"
        shell: bash
        env:
          INPUT_CONFIG: 'lfreleng-actions@main'
        run: |
          # Config mode publishes it too
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/env_config"
          : > "$captured_env"
          # The policy applies before the config branch returns, so this
          # asserts ordering rather than config resolution -- which
          # test-config-mode already covers. Tolerate a resolution
          # failure so the two tests stay independent.
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/out_config" \
          GITHUB_STEP_SUMMARY="${RUNNER_TEMP}/sum_config" \
            node src/pre.mjs || true
          if ! grep -q '^GH_TELEMETRY=false$' "$captured_env"; then
            echo "Error: config flow skipped the telemetry policy ❌"
            cat "$captured_env"
            exit 1
          fi
          echo "Config-mode case passed ✅"

      - name: "A caller's own value survives"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ${{ steps.stage.outputs.al_file }}
          GH_TELEMETRY: 'log'
        run: |
          # A caller's own value survives
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/env_caller"
          : > "$captured_env"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/out_caller" \
          GITHUB_STEP_SUMMARY="${RUNNER_TEMP}/sum_caller" \
            node src/pre.mjs
          if grep -q '^GH_TELEMETRY=' "$captured_env"; then
            echo "Error: clobbered a caller-supplied GH_TELEMETRY ❌"
            cat "$captured_env"
            exit 1
          fi
          echo "Caller-precedence case passed ✅"

      - name: "A caller's empty value survives"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ${{ steps.stage.outputs.al_file }}
          GH_TELEMETRY: ''
        run: |
          # A caller's empty value survives
          set -euo pipefail
          # Precondition: an empty value must reach the step as a SET
          # variable, otherwise this case proves nothing.
          if [ -z "${GH_TELEMETRY+x}" ]; then
            echo "Error: runner did not export an empty GH_TELEMETRY ❌"
            exit 1
          fi
          captured_env="${RUNNER_TEMP}/env_empty"
          : > "$captured_env"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/out_empty" \
          GITHUB_STEP_SUMMARY="${RUNNER_TEMP}/sum_empty" \
            node src/pre.mjs
          # The CLI's falsey list includes the empty string, so an empty
          # value is a deliberate opt-out the action must not overwrite.
          if grep -q '^GH_TELEMETRY=' "$captured_env"; then
            echo "Error: overwrote a caller-supplied empty GH_TELEMETRY ❌"
            cat "$captured_env"
            exit 1
          fi
          echo "Empty-value case passed ✅"

      - name: "Opt-out leaves the environment untouched"
        shell: bash
        env:
          INPUT_ALLOW_LIST_PATH: ${{ steps.stage.outputs.al_file }}
          INPUT_DISABLE_GH_TELEMETRY: 'false'
        run: |
          # Opt-out leaves the environment untouched
          set -euo pipefail
          captured_env="${RUNNER_TEMP}/env_optout"
          : > "$captured_env"
          GITHUB_ENV="$captured_env" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/out_optout" \
          GITHUB_STEP_SUMMARY="${RUNNER_TEMP}/sum_optout" \
            node src/pre.mjs
          if grep -q '^GH_TELEMETRY=' "$captured_env"; then
            echo "Error: disable_gh_telemetry=false still published it ❌"
            cat "$captured_env"
            exit 1
          fi
          # The allow-list itself must still load.
          if ! grep -q '^CONNECTION_ALLOW_LIST=github\.com:443$' \
                 "$captured_env"; then
            echo "Error: opt-out broke the allow-list export ❌"
            exit 1
          fi
          echo "Opt-out case passed ✅"
