# Runs the config-resolver unit tests (pytest).
#
# The action's main code path is exercised via node (see
# testing.yaml), but the shared src/resolve_config_source.py module
# carries its own pytest suite that pins the `config` grammar and the
# mode-selected sanitisers. A companion suite
# (test_allow_list_format_equivalence.py) pins the invariant that the
# ingress file's layout -- one line or many, with or without comments
# -- never changes the sanitised output. Without this job those tests
# would never run in CI and regressions could merge unnoticed.

name: 'Resolver tests 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/resolve_config_source.py'
      - 'tests/test_resolve_config_source.py'
      - 'tests/test_allow_list_format_equivalence.py'
      - '.github/workflows/resolver-tests.yaml'
  pull_request:
    branches: ['main']
    paths:
      - 'src/resolve_config_source.py'
      - 'tests/test_resolve_config_source.py'
      - 'tests/test_allow_list_format_equivalence.py'
      - '.github/workflows/resolver-tests.yaml'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  pytest:
    name: 'Run resolver unit tests'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Setup Python'
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: 'Run resolver unit tests'
        shell: bash
        run: |
          # Stdlib-only module; pytest is the sole test dependency.
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest tests/ -q
